# =============================================================================
# Experiment 1 (backward-trajectory) + geometric perturbations — shared config
# =============================================================================
# These are the AGREED default settings. They match the script defaults, except
# where a run explicitly overrides them (noted below). Share this file so every
# run uses the same model, schedule, seeds and metrics.
#
# This is a reference/record file. The scripts take their values from CLI flags;
# keep this in sync with the commands you actually run.

model:
  name: DiT-XL/2               # facebookresearch/DiT, pretrained, inference only
  image_size: 256
  latent_size: 32              # image_size / 8
  num_classes: 1000
  vae: stabilityai/sd-vae-ft-mse
  latent_scale: 0.18215

sampler:
  type: DDPM-ancestral         # re-implemented on top of diffusion.p_mean_variance
  num_steps: 250               # respaced steps (--num-steps)
  cfg_scale: 4.0               # classifier-free guidance (--cfg-scale)
  clip_denoised: false

# Two RNGs kept separate so ensemble spread is attributable to the perturbation,
# not to sampler stochasticity. Do NOT reuse the same value for both.
seeds:
  trajectory: 0                # fixed start point of the reference trajectory
  denoise: 1000                # reverse-process noise; SHARED across ensemble members
  perturb_backward: 2000       # exp1: member m uses perturb + m
  perturb_geom: 3000           # exp_geom ensemble mode

metrics:
  clip: openai/clip-vit-base-patch32
  dino: vit_small_patch14_dinov2.lvd142m
  lpips: alex
  reported:                    # spread = mean over pairs; deviation = mean to reference
    - clip_cosine_distance
    - dino_cosine_distance
    - lpips
    - latent_mse

# ---------------------------------------------------------------------------
# Experiment 1 — moving backward along the trajectory (exp1_renoise.py)
# ---------------------------------------------------------------------------
exp1_backward:
  ensemble: 16                 # M members (--ensemble)
  ks: [1, 2, 5]                # sampler steps re-noised backward (--ks)
  t_fracs: [0.1, 0.3, 0.5, 0.7, 0.9]   # fraction of denoising done at saved latent
  noise_types: [gaussian]      # available: gaussian, uniform, laplace
  baseline: k0-denoise-seeds   # same latent, different denoising noise
  classes_2: [207, 88]         # the original 2-class run

  # override used for the 45-class tier sweep (cheaper: ~4x faster per class)
  tier_run_override:
    ensemble: 8
    t_fracs: [0.3, 0.5, 0.7]

# ---------------------------------------------------------------------------
# Geometric perturbations (exp_geom.py)
# ---------------------------------------------------------------------------
exp_geom:
  ensemble: 8                  # M members for the random-transform (spread) mode
  t_fracs: [0.3, 0.5, 0.7]
  padding: reflection          # grid_sample padding (reflection | border | zeros)
  transforms: [rotation, translation, scaling, flip, shear]
  classes_per_tier: 3          # default subset; use --all-classes for all 45
  translation_units: latent-pixels   # normalised by latent_size=32

  # deterministic magnitude sweep (deviation from reference + equivariance)
  sweep_params:
    rotation:    [0, 5, 10, 20, 30, 45]      # degrees
    translation: [0, 1, 2, 4, 6, 8]          # latent pixels, along x
    scaling:     [0.8, 0.9, 1.0, 1.1, 1.25, 1.5]   # >1 = zoom in
    flip:        [0, 1]                       # horizontal
    shear:       [0.0, 0.05, 0.1, 0.2, 0.3]

  # random-transform ensemble: param ~ U(-level, +level); flip excluded (binary)
  ensemble_levels:
    rotation:    [10, 20, 30]                 # +/- degrees
    translation: [2, 4, 6]                    # +/- latent pixels (dx, dy)
    scaling:     [0.1, 0.2, 0.3]              # +/- fraction around 1.0
    shear:       [0.1, 0.2, 0.3]              # +/- shear

# ---------------------------------------------------------------------------
# Class difficulty tiers (tiers.py) — assigned by per-class KID (clean-fid)
# ---------------------------------------------------------------------------
tiers:
  source: images_classes/kid_difficulty_tiers.png
  kid_note: KID_APPROX values in tiers.py are digitised off the chart (approx)
  hardest: [63, 38, 34, 47, 51, 33, 979, 61, 21, 44, 36, 35, 67, 29, 65]
  medium:  [10, 9, 91, 71, 49, 16, 57, 360, 974, 41, 83, 48, 26, 94, 69]
  easiest: [15, 92, 19, 14, 37, 85, 25, 95, 13, 82, 88, 24, 22, 72, 90]